# CI/CD pipeline. Pull requests: tests and checks only. Push to main: the same
# checks, then build, push and deploy the Docker image to Azure (see docs/cicd.md).
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: jobs can only read the repository unless they ask for more.
permissions:
  contents: read

jobs:
  test:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # A throwaway PostgreSQL container next to the job, like docker-compose's db.
    # Its user, password and database match the defaults in tests/conftest.py.
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecom_test

    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved, a SHA cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      # The tests already applied every migration; this confirms the models
      # and the migrations describe the same schema.
      - name: Check models match migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          SECRET_KEY: ci-only-secret-key-that-is-at-least-32-chars
        run: alembic check

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure

      # -backend=false: download the providers only. No Azure login and no state,
      # so this checks the code itself, not the live infrastructure.
      - name: Validate both layers
        run: |
          for layer in foundation app; do
            terraform -chdir=infrastructure/$layer init -backend=false -input=false
            terraform -chdir=infrastructure/$layer validate
          done

  image:
    name: Docker image builds and starts
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t ecom-api:ci .

      # /health needs no database, so dummy settings are enough to prove that the
      # image starts and answers. Docker's HEALTHCHECK (in the Dockerfile) decides.
      - name: Start container and wait until healthy
        run: |
          docker run -d --name ecom-ci \
            -e DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci \
            -e SECRET_KEY=ci-only-secret-key-that-is-at-least-32-chars \
            ecom-api:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ecom-ci)
            echo "attempt $attempt: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker logs ecom-ci
          exit 1

  deploy:
    name: Deploy to Azure
    needs: [test, terraform, image]
    # Only a push to main deploys; pull requests stop after the checks above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Azure identity trusts only jobs in this GitHub environment, and the
    # environment accepts only the main branch (see docs/cicd.md).
    environment: production
    # One deploy at a time; a newer push waits instead of interrupting a deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token for Azure
    env:
      # Stored as secrets only so they appear as *** in the public logs.
      ACR_NAME: ${{ secrets.ACR_NAME }}
      WEBAPP_NAME: ${{ secrets.WEBAPP_NAME }}
      RESOURCE_GROUP: rg-ecom-mini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OIDC login: no password. Azure checks GitHub's signed token against the
      # federated credential of the deploy identity (Terraform foundation layer).
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image (tag = short commit SHA)
        run: |
          image="$ACR_NAME.azurecr.io/ecom-api:${GITHUB_SHA::7}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          az acr login --name "$ACR_NAME"
          docker build -t "$image" .
          docker push "$image"

      - name: Deploy, wait until healthy, smoke test
        run: bash scripts/deploy.sh "$IMAGE"
